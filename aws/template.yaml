AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: bndy Capture API - API Gateway, Lambda, DynamoDB, S3 and Route 53 custom domain

Parameters:
  CaptureToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Bearer token used by the Android app, MCP clients and AWS processors
  DomainName:
    Type: String
    Default: capture.bndy.co.uk
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for bndy.co.uk
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin for existing Capture clients
  PublicAllowedOrigins:
    Type: String
    Default: https://chat.bndy.live
    Description: Comma-separated browser origins allowed to use the public Dropzone transport
  PublicRateLimit:
    Type: Number
    Default: 20
    Description: Maximum public submission actions per source IP in each rate window
  PublicRateWindowSeconds:
    Type: Number
    Default: 600
    Description: Public submission rate-limit window in seconds
  PublicMaxImageBytes:
    Type: Number
    Default: 5242880
    Description: Maximum public poster image size in bytes
  CaptureQueueUrl:
    Type: String
    Default: ''
    Description: Backline Capture processing queue URL; blank keeps scanner-only dispatch
  CaptureQueueArn:
    Type: String
    Default: ''
    Description: Backline Capture processing queue ARN; required with CaptureQueueUrl
  WhatsAppEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enables the production WhatsApp Cloud API webhook and workers
  WhatsAppVerifyToken:
    Type: String
    NoEcho: true
    Default: disabled
    Description: Meta webhook verification token
  WhatsAppAppSecret:
    Type: String
    NoEcho: true
    Default: disabled
    Description: Meta app secret used to verify webhook signatures
  WhatsAppAccessToken:
    Type: String
    NoEcho: true
    Default: disabled
    Description: WhatsApp Cloud API access token
  WhatsAppPhoneNumberId:
    Type: String
    Default: disabled
    Description: Meta phone number ID for the dedicated BNDY WhatsApp number
  WhatsAppGraphVersion:
    Type: String
    Default: v25.0
    AllowedPattern: '^v[0-9]+\.[0-9]+$'
    Description: Explicit Meta Graph API version used by the WhatsApp worker
  WhatsAppFollowUpTemplate:
    Type: String
    Default: ''
    Description: Approved Meta template with one body parameter for Chatzone review updates

Conditions:
  HasCaptureQueue: !And
    - !Not [!Equals [!Ref CaptureQueueUrl, '']]
    - !Not [!Equals [!Ref CaptureQueueArn, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        CAPTURES_TABLE: !Ref CapturesTable
        CAPTURE_TOKEN: !Ref CaptureToken
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        IMAGE_BUCKET: !Ref CaptureImagesBucket
        PUBLIC_ALLOWED_ORIGINS: !Ref PublicAllowedOrigins
        PUBLIC_RATE_LIMIT: !Ref PublicRateLimit
        PUBLIC_RATE_WINDOW_SECONDS: !Ref PublicRateWindowSeconds
        PUBLIC_MAX_IMAGE_BYTES: !Ref PublicMaxImageBytes
        FOLLOW_UP_TTL_DAYS: '30'
        WHATSAPP_ENABLED: !Ref WhatsAppEnabled
        WHATSAPP_QUEUE_URL: !Ref WhatsAppQueue
        WHATSAPP_SECRET_ARN: !Ref WhatsAppServiceSecret
        WHATSAPP_GRAPH_VERSION: !Ref WhatsAppGraphVersion
        WHATSAPP_FOLLOW_UP_TEMPLATE: !Ref WhatsAppFollowUpTemplate
        CAPTURE_QUEUE_URL: !Ref CaptureQueueUrl

Resources:
  CaptureServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: bndy/capture-service
      Description: Shared bearer token for the BNDY capture API
      SecretString: !Sub '{"token":"${CaptureToken}"}'

  WhatsAppServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: bndy/whatsapp-service
      Description: Meta WhatsApp Cloud API configuration for Send to bndy
      SecretString: !Sub '{"verifyToken":"${WhatsAppVerifyToken}","appSecret":"${WhatsAppAppSecret}","accessToken":"${WhatsAppAccessToken}","phoneNumberId":"${WhatsAppPhoneNumberId}"}'

  CaptureApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  CaptureImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'bndy-capture-images-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - https://chat.bndy.live
            AllowedMethods:
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldCaptureImages
            Status: Enabled
            ExpirationInDays: 180

  WhatsAppDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  WhatsAppQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WhatsAppDeadLetterQueue.Arn
        maxReceiveCount: 5

  CaptureFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CapturesTable
        - S3WritePolicy:
            BucketName: !Ref CaptureImagesBucket
        - S3ReadPolicy:
            BucketName: !Ref CaptureImagesBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WhatsAppQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref WhatsAppServiceSecret
        - !If
          - HasCaptureQueue
          - Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref CaptureQueueArn
          - !Ref AWS::NoValue
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /health
            Method: GET
        PublicCreateImageUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/public/uploads/image
            Method: POST
        PublicCreateCapture:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/public/captures
            Method: POST
        PublicGetCapture:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/public/captures/{id}
            Method: GET
        PublicSaveCaptureFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/public/captures/{id}/follow-up
            Method: POST
        WhatsAppVerifyWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/whatsapp/webhook
            Method: GET
        WhatsAppReceiveWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/whatsapp/webhook
            Method: POST
        CreateImageUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/uploads/image
            Method: POST
        CreateCapture:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures
            Method: POST
        ListCaptures:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures
            Method: GET
        GetCapture:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}
            Method: GET
        GetCaptureFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/follow-up
            Method: GET
        UpdateCaptureFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/follow-up
            Method: PATCH
        GetCaptureMedia:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/media
            Method: GET
        ReviewCapture:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/review
            Method: POST
        NotifyCaptureFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/notify
            Method: POST
        ClaimCapture:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/claim
            Method: PATCH
        UpdateStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/status
            Method: PATCH
        AddNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaptureApi
            Path: /v1/captures/{id}/notes
            Method: POST

  WhatsAppWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.whatsapp_worker_handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CapturesTable
        - S3WritePolicy:
            BucketName: !Ref CaptureImagesBucket
        - S3ReadPolicy:
            BucketName: !Ref CaptureImagesBucket
        - SQSPollerPolicy:
            QueueName: !GetAtt WhatsAppQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref WhatsAppServiceSecret
      Events:
        WhatsAppQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt WhatsAppQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  CapturesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: receivedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-receivedAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: receivedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  CaptureCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  CaptureCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CaptureCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  CaptureApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref CaptureApi
      DomainName: !Ref CaptureCustomDomain
      Stage: '$default'

  CaptureDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CaptureCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt CaptureCustomDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

Outputs:
  ApiUrl:
    Description: Default API Gateway endpoint
    Value: !Sub 'https://${CaptureApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  CustomApiUrl:
    Description: Stable Capture API endpoint
    Value: !Sub 'https://${DomainName}'
  CapturesTableName:
    Value: !Ref CapturesTable
  CaptureFunctionName:
    Value: !Ref CaptureFunction
  CaptureServiceSecretArn:
    Value: !Ref CaptureServiceSecret
  WhatsAppServiceSecretArn:
    Value: !Ref WhatsAppServiceSecret
  WhatsAppWebhookUrl:
    Value: !Sub 'https://${DomainName}/v1/whatsapp/webhook'
  WhatsAppQueueUrl:
    Value: !Ref WhatsAppQueue
  CaptureImagesBucketName:
    Value: !Ref CaptureImagesBucket
